[package]
name = "mantra-macros"
description = "Provides macros to create requirement traces and coverage logs for the `mantra` framework."
edition.workspace = true
repository.workspace = true
license.workspace = true
version = "0.9.0"

[dependencies]
mantra-procm = { path = "../mantra-procm", version = "0.9.0" }
regex = { workspace = true, optional = true }
log = { workspace = true, optional = true }
defmt = { version = "1", optional = true }

[features]
coverage = ["mantra-procm/coverage"]
log = ["coverage", "dep:log"]
defmt = ["coverage", "dep:defmt"]
extract = ["dep:regex"]
