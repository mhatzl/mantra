[package]
name = "mantra-macros"
description = "Provides macros to create requirement traces and coverage logs for the `mantra` framework."
version.workspace = true
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
mantra-procm = { path = "../mantra-procm", version = "0.8.0" }
regex = { workspace = true, optional = true }
log = { workspace = true, optional = true }
defmt = { version = "1", optional = true }

[features]
coverage = ["mantra-procm/coverage"]
log = ["coverage", "dep:log"]
defmt = ["coverage", "dep:defmt"]
extract = ["dep:regex"]
