[workspace]
resolver = "3"
members = [
    "mantra",
    "langs/mantra-lang-tracing",
    "langs/rust/mantra-procm",
    "langs/rust/mantra-macros",
    "schema", "schema-gen",
]

[workspace.dependencies]
regex = "1.10.4"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0" }
log = "0.4.21"
env_logger = "0.11.3"
schemars = "1.2.3"
sqlx = "0.9.0"
anyhow = "1.0.100"
urlencoding = "2.1.3"
thiserror = "1.0.59"
insta = { version = "1.48.0", features = ["ron"] }

[workspace.package]
version = "0.8.0"
rust-version = "1.94.0"
edition = "2024"
repository = "https://github.com/mhatzl/mantra"
license = "MIT"

[profile.dev.package.sqlx-macros]
opt-level = 3

# Workaround for a bug in Apple's Command Line Tools 27 linker (`ld-27037.1`):
# stripping debug info (the release default, `strip = "debuginfo"`) while linking
# proc-macro dylibs mis-aligns the LINKEDIT string pool, producing dylibs that
# `dlopen` refuses to load (e.g. `libsqlx_macros-*.dylib`). Disabling stripping for
# `sqlx-macros` works around this without affecting the final binary.
[profile.release.package.sqlx-macros]
strip = false
